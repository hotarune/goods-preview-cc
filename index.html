<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="doc.title">Acrylic Shikishi Preview</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app">
    <main id="stage">
      <header class="brand">
        <div class="brand-mark" aria-hidden="true"></div>
        <div>
          <div class="brand-name" data-i18n-html="brand.name">Acrylic <b>Shikishi</b></div>
          <div class="brand-sub" data-i18n="brand.sub">Surface film preview</div>
        </div>
      </header>

      <label class="lang-menu">
        <span class="sr-only" data-i18n="lang.label">Language</span>
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3Z"/></svg>
        <select id="lang" data-i18n-title="lang.label"></select>
      </label>

      <div id="viewport"></div>

      <div id="compare-hint" class="hint" data-i18n="compare.hint" hidden>Click a board to inspect it</div>

      <nav id="dock" aria-label="Film finishes" data-i18n-aria-label="dock.label">
        <div id="swatches" class="swatches" role="radiogroup"></div>
        <div class="dock-sep"></div>
        <button id="btn-explode" class="dock-btn round" title="Exploded layer view (E)" data-i18n-title="dock.explode" aria-pressed="false">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3 3 8l9 5 9-5-9-5Z"/><path d="m3 12.5 9 5 9-5"/><path d="m3 17 9 5 9-5"/></svg>
        </button>
        <button id="btn-compare" class="dock-btn" title="Compare all films (C)" data-i18n-title="dock.compare" aria-pressed="false">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        </button>
        <button id="btn-pause" class="dock-btn" title="Pause motion (Space)" data-i18n-title="dock.pause" aria-pressed="false">
          <svg class="i-pause" viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
          <svg class="i-play" viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M7 5v14l12-7z"/></svg>
        </button>
      </nav>
    </main>

    <aside id="panel">
      <section class="film-info">
        <div id="film-eyebrow" class="eyebrow">01 / 10 · Surface film</div>
        <h1 id="film-name">Gloss</h1>
        <p id="film-desc" class="film-desc"></p>
        <div id="film-spec" class="mono"></div>
        <div id="film-tip" class="tip" data-i18n="film.tip" hidden></div>
      </section>

      <section>
        <h2 data-i18n="art.title">Artwork</h2>
        <div id="art-tiles" class="art-tiles">
          <button data-art="night" class="art-tile" aria-pressed="true"><canvas></canvas><span data-i18n="art.night">Night</span></button>
          <button data-art="pastel" class="art-tile" aria-pressed="false"><canvas></canvas><span data-i18n="art.pastel">Pastel</span></button>
          <label class="art-tile upload" title="Upload an image (or drop it anywhere)" data-i18n-title="art.uploadTitle">
            <input id="file" type="file" accept="image/*" hidden />
            <span class="plus">＋</span><span data-i18n="art.upload">Upload</span>
          </label>
        </div>
      </section>

      <section>
        <h2 data-i18n="size.title">Size</h2>
        <div id="sizes" class="seg"></div>
      </section>

      <section>
        <h2 data-i18n="thickness.title">Acrylic thickness</h2>
        <div id="thickness" class="seg"></div>
      </section>

      <section>
        <h2 data-i18n="light.title">Lighting</h2>
        <label class="row switch">
          <span data-i18n="light.follow">Light follows cursor</span>
          <input id="follow" type="checkbox" />
          <i></i>
        </label>
        <label class="row">
          <span data-i18n="light.strength">Film effect strength</span>
          <input id="strength" type="range" min="0" max="2" step="0.05" value="1" />
        </label>
      </section>

      <section class="keys mono">
        <div><kbd>1</kbd>–<kbd>0</kbd> <span data-i18n="keys.film">film</span></div>
        <div><kbd>E</kbd> <span data-i18n="keys.explode">explode</span></div>
        <div><kbd>C</kbd> <span data-i18n="keys.compare">compare</span></div>
        <div><kbd data-i18n="keys.space">Space</kbd> <span data-i18n="keys.pause">pause</span></div>
        <div data-i18n="keys.orbit">Drag to orbit · scroll to zoom</div>
      </section>
    </aside>

    <div id="drop" hidden><div data-i18n="drop.text">Drop image to use as artwork</div></div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
